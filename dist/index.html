<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f4">
  <meta name="description" content="Menu, reservasi, pemesanan, dan media sosial Slovv Coffee.">
  <title>Slovv Coffee</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f8f25'/%3E%3Cpath d='M14 18c10-7 27-5 35 2l-7 9c-8-5-17-5-20-2-2 2 0 4 5 5l9 2c11 3 14 10 10 18-5 8-21 9-32 1l6-9c8 5 16 5 20 3 2-2 0-4-5-5l-9-2c-11-3-16-13-12-22Z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root { --green:#178128; --ink:#17231c; --muted:#707872; --paper:#faf8f4; --card:#fff; --line:#e2e5df; --mint:#def3e2; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    button, a { font:inherit; -webkit-tap-highlight-color:transparent; }
    button { color:inherit; }
    .page { width:min(100% - 32px, 520px); margin:0 auto; padding:34px 0 44px; }
    .view[hidden] { display:none; }
    .view.enter { animation:viewIn .42s cubic-bezier(.22,.8,.25,1) both; }
    .logo-card { width:280px; height:130px; margin:0 auto; overflow:hidden; background:var(--paper); }
    .logo-card img { display:block; width:280px; max-width:none; margin:-50px 0 0 50%; transform:translateX(-50%); mix-blend-mode:multiply; }
    .identity { margin:32px 0 38px; text-align:center; }
    .identity h1 { margin:0; font-size:2rem; line-height:1.15; letter-spacing:-.035em; }
    .identity p { margin:12px 0 0; color:var(--muted); font-size:1.08rem; }
    .link-list { display:grid; gap:14px; }
    .action { --i:0; display:flex; align-items:center; gap:18px; width:100%; min-height:82px; padding:13px 20px; border:1px solid var(--line); border-radius:22px; background:var(--card); color:var(--ink); text-decoration:none; text-align:left; box-shadow:0 7px 18px rgba(23,45,30,.07); cursor:pointer; opacity:0; transform:translateY(14px); animation:itemIn .5s cubic-bezier(.22,.8,.25,1) forwards; animation-delay:calc(80ms + var(--i) * 55ms); transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
    .action:hover, .action:focus-visible { transform:translateY(-3px); border-color:#bdc9bd; box-shadow:0 13px 28px rgba(23,45,30,.12); outline:none; }
    .action:active { transform:scale(.985); }
    .action strong { font-size:1.04rem; font-weight:500; }
    .brand-icon { flex:0 0 auto; display:grid; place-items:center; width:52px; height:52px; border-radius:50%; background:var(--mint); overflow:hidden; }
    .brand-icon svg { width:29px; height:29px; }
    .brand-icon.gofood { background:#dff5e5; }
    .brand-icon.gofood svg { width:36px; height:36px; }
    .brand-icon.whatsapp { background:transparent; }
    .brand-icon.whatsapp svg { width:52px; height:52px; }
    .brand-icon.grab { background:#e0f4e5; color:#00a83b; font-size:.84rem; font-weight:800; letter-spacing:-.06em; }
    .brand-icon.instagram { background:linear-gradient(145deg,#7359d9,#f24b75 55%,#f4a64b); color:white; }
    .brand-icon.tiktok { background:#141414; color:white; }
    .brand-icon.maps { background:#edf5ec; }
    footer { padding-top:30px; text-align:center; color:#969d97; font-size:.78rem; }

    .menu-top { display:flex; align-items:center; margin-bottom:28px; }
    .back { display:flex; align-items:center; gap:9px; padding:9px 2px; border:0; background:transparent; color:#667068; cursor:pointer; font-size:1rem; }
    .back svg { width:21px; height:21px; transition:transform .2s ease; }
    .back:hover svg { transform:translateX(-3px); }
    .menu-head { margin:30px 0 24px; text-align:center; }
    .menu-head h2 { margin:0; font-size:2rem; letter-spacing:-.035em; }
    .hours { display:flex; justify-content:center; align-items:center; gap:9px; margin-top:13px; color:var(--muted); font-size:.96rem; }
    .hours svg { width:19px; height:19px; }
    .tabs { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:1fr 1.28fr .72fr; gap:8px; padding:10px 0 14px; background:linear-gradient(var(--paper) 78%, transparent); }
    .tab { min-height:44px; padding:8px 10px; border:1px solid #d8ddd7; border-radius:999px; background:white; cursor:pointer; font-size:.86rem; box-shadow:0 4px 10px rgba(23,45,30,.05); transition:background .22s ease,color .22s ease,transform .22s ease; }
    .tab[aria-selected="true"] { border-color:var(--green); background:var(--green); color:white; }
    .tab:hover { transform:translateY(-1px); }
    .menu-groups { display:grid; gap:15px; margin-top:7px; }
    .menu-group { padding:25px 22px 21px; border:1px solid var(--line); border-radius:25px; background:white; box-shadow:0 7px 20px rgba(23,45,30,.06); animation:groupIn .42s cubic-bezier(.22,.8,.25,1) both; }
    .menu-group h3 { margin:0 0 20px; color:var(--green); font-size:1.12rem; letter-spacing:.08em; text-transform:uppercase; }
    .price-head, .menu-row { display:grid; grid-template-columns:minmax(0,1fr) 45px 45px; gap:8px; align-items:end; }
    .price-head { margin-bottom:8px; color:#7d847f; font-size:.72rem; font-weight:700; }
    .price-head span:first-child { color:var(--ink); letter-spacing:.08em; text-transform:uppercase; }
    .price-head span:not(:first-child), .price { text-align:right; }
    .menu-row { min-height:39px; font-size:.94rem; }
    .item-name { display:flex; align-items:baseline; min-width:0; white-space:nowrap; }
    .item-name::after { content:""; flex:1; min-width:12px; margin:0 8px 3px; border-bottom:1px dashed #dfe2de; }
    .price { color:#555f58; }
    .price:first-of-type { color:var(--green); }
    .single-price .menu-row { grid-template-columns:minmax(0,1fr) 55px; }
    .single-price .price-head { grid-template-columns:minmax(0,1fr) 55px; }

    @keyframes viewIn { from { opacity:0; transform:translateY(12px); } }
    @keyframes itemIn { to { opacity:1; transform:none; } }
    @keyframes groupIn { from { opacity:0; transform:translateY(10px); } }
    @media (max-width:400px) {
      .page { width:min(100% - 22px, 520px); padding-top:25px; }
      .logo-card { width:270px; height:126px; }
      .logo-card img { width:280px; margin-top:-50px; }
      .identity { margin:27px 0 31px; }
      .identity h1 { font-size:1.8rem; }
      .action { min-height:76px; padding:11px 15px; border-radius:20px; }
      .brand-icon { width:49px; height:49px; }
      .tabs { gap:6px; }
      .tab { font-size:.78rem; padding-inline:6px; }
      .menu-group { padding:23px 17px 19px; }
      .menu-row { font-size:.87rem; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-delay:0ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="view home-view enter" id="homeView" aria-labelledby="siteTitle">
      <div class="logo-card"><img src="assets/slovv-logo.png" alt="Slovv Coffee"></div>
      <div class="identity"><h1 id="siteTitle">Slovv Coffee</h1><p>SlovvChillSpace</p></div>
      <div class="link-list">
        <button class="action" style="--i:0" id="showMenu" type="button">
          <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#178128" stroke-width="2"><path d="M5 7.5c4-1.6 7.7-.8 11 2.2 3.3-3 7-3.8 11-2.2v18c-4-1.6-7.7-.8-11 2.2-3.3-3-7-3.8-11-2.2v-18Z"/><path d="M16 10v17M9 12h4M19 12h4M9 16h4M19 16h4"/></svg></span>
          <strong>Lihat Menu</strong>
        </button>
        <a class="action" style="--i:1" href="https://wa.me/6285156719655?text=Halo%20Slovv%20Coffee%2C%20saya%20ingin%20reservasi." target="_blank" rel="noopener noreferrer">
          <span class="brand-icon whatsapp" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="#25D366"/><path d="M29.2 19.5a9.2 9.2 0 0 1-13.5 8.2L11 29l1.4-4.4a9.2 9.2 0 1 1 16.8-5.1Z" stroke="white" stroke-width="2.2" stroke-linejoin="round"/><path d="M16.1 14.4c.5 2.8 2.4 4.7 5.3 5.9l1.5-1.1c.5-.3 1-.2 1.4.2l1.1 1.1" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg></span>
          <strong>Reservasi via WhatsApp</strong>
        </a>
        <a class="action" style="--i:2" href="https://gofood.link/a/SZQDePN" target="_blank" rel="noopener noreferrer">
          <span class="brand-icon gofood" aria-hidden="true"><svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="9" fill="#00aa13"/><circle cx="20" cy="20" r="8" fill="white"/><circle cx="20" cy="20" r="3.4" fill="#00aa13"/></svg></span>
          <strong>Pesan via GoFood</strong>
        </a>
        <a class="action" style="--i:3" href="https://app.grab.com/s/vZJCcv5j" target="_blank" rel="noopener noreferrer">
          <span class="brand-icon grab" aria-hidden="true">Grab</span>
          <strong>Pesan via GrabFood</strong>
        </a>
        <a class="action" style="--i:4" href="https://maps.app.goo.gl/gNS6xez9LyTormsW8" target="_blank" rel="noopener noreferrer">
          <span class="brand-icon maps" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 29S6.5 20.8 6.5 12.9A9.5 9.5 0 0 1 25 9.8" stroke="#34a853" stroke-width="3"/><path d="M25 9.8c1.5 5.7-3.7 13.7-9 19.2" stroke="#4285f4" stroke-width="3"/><path d="M7.4 9.1 13 13" stroke="#fbbc04" stroke-width="3"/><path d="M25 9.8 19.7 14" stroke="#ea4335" stroke-width="3"/><circle cx="16" cy="13" r="4" fill="white" stroke="#4285f4" stroke-width="2"/></svg></span>
          <strong>Find us on Maps</strong>
        </a>
        <a class="action" style="--i:5" href="https://www.instagram.com/slovv_chill_space?stkn=MTI0bWI0MWswMTh1Mg==" target="_blank" rel="noopener noreferrer">
          <span class="brand-icon instagram" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="5" y="5" width="22" height="22" rx="7"/><circle cx="16" cy="16" r="5"/><path d="M23.3 8.8h.01"/></svg></span>
          <strong>Instagram</strong>
        </a>
        <a class="action" style="--i:6" href="https://www.tiktok.com/@slovv.coffee?_r=1&amp;_t=ZS-9A0HCgG5ufX" target="_blank" rel="noopener noreferrer">
          <span class="brand-icon tiktok" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M18 6v13a6 6 0 1 1-5-5.9" stroke="#25f4ee" stroke-width="3"/><path d="M19.5 5.5c.8 4 3.1 5.6 6.5 5.8" stroke="#fe2c55" stroke-width="3"/><path d="M18.8 5.5v13a6 6 0 1 1-5-5.9M19 5.5c.8 4 3.1 5.6 6.5 5.8" stroke="white" stroke-width="2"/></svg></span>
          <strong>TikTok</strong>
        </a>
      </div>
      <footer>© 2026 Slovv Coffee</footer>
    </section>

    <section class="view menu-view" id="menuView" hidden aria-labelledby="menuTitle">
      <div class="menu-top"><button class="back" id="backHome" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>Kembali</button></div>
      <div class="logo-card"><img src="assets/slovv-logo.png" alt="Slovv Coffee"></div>
      <div class="menu-head"><h2 id="menuTitle">Menu</h2><div class="hours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Buka setiap hari 08.00 – 03.00 WIB</span></div></div>
      <div class="tabs" role="tablist" aria-label="Kategori menu">
        <button class="tab" role="tab" aria-selected="true" data-menu="coffee">Coffee Base</button>
        <button class="tab" role="tab" aria-selected="false" data-menu="noncoffee">Non Coffee Base</button>
        <button class="tab" role="tab" aria-selected="false" data-menu="food">Food</button>
      </div>
      <div class="menu-groups" id="menuGroups" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const menus = {
      coffee: [
        { title:'Milk Beverages', columns:['R','L'], items:[['Kopi Susu Slovv V1','16k','20k'],['Kopi Susu Slovv V2','18k','23k'],['Spanish Aren Latte','18k','23k'],['Butterscotch Latte','18k','23k'],['Caramel Latte','18k','23k'],['Hazelnut Latte','18k','23k'],['Pistachio Latte','18k','23k'],['Coconut Latte','18k','23k'],['Pandan Latte','18k','23k'],['Mochaccino','18k','23k'],['Dirty Latte','23k','–'],['Cappuccino','20k','–'],['Coffee Latte','23k','–']]},
        { title:'Americano Series', columns:['R','L'], items:[['Aerocano','16k','20k'],['Americano','16k','20k'],['Americano Peach','18k','23k'],['Americano Mango','18k','23k'],['Americano Pineapple','18k','23k']]},
        { title:'Coffee Classic', columns:['Harga'], items:[['Espresso Arabica','10k'],['Kopi Tubruk','11k'],['Kopi Tubruk Susu','13k'],['Doppio Arabica','20k'],['Vietnam Drip','23k'],['V60 / Japanese','23k']]},
        { title:'Mont Blanc', columns:['Harga'], items:[['Mont Blanc','23k'],['Cosmic Mont Blanc','23k'],['Tropical Mont Blanc','23k']]}
      ],
      noncoffee: [
        { title:'Milk Base', columns:['R','L'], items:[['Cokelat Latte','18k','22k'],['Cokelat Butterscotch','20k','23k'],['Cokelat Hazelnut','20k','23k'],['Cokelat Caramel','20k','23k'],['Matcha Latte','20k','23k'],['Matcha Berry','20k','23k'],['Matcha Cloud','20k','23k']]},
        { title:'Tea Series', columns:['R','L'], items:[['Black Tea','10k','12k'],['Lemon Tea','14k','17k'],['Mix Tea','14k','17k'],['Lecy Tea','14k','17k'],['Peach Tea','14k','17k'],['Mango Tea','14k','17k']]},
        { title:'Sparkling Series', columns:['R','L'], items:[['Sunrise','18k','23k'],['Sky Blue','18k','23k'],['Peachnipple','18k','23k'],['Emerald Splash','18k','23k']]},
        { title:'Ice Cream Series', columns:['Harga'], items:[['Affogato','20k'],['Affogato Cokelat','20k'],['Affogato Matcha','20k']]},
        { title:'Add On', columns:['Harga'], items:[['Extra Shot','5k–7k'],['Ice Cream','5k'],['Oatside Milk','5k']]}
      ],
      food: [
        { title:'Happy Food', columns:['Harga'], items:[['Nasi Goreng Slovv','20k'],['Nasi Goreng Saos Tiram','20k'],['Mie Goreng Slovv','20k'],['Mie Goreng Saos Tiram','20k'],['Mie Nyemek','15k'],['Kwetiau','20k'],['Nasi Daun Jeruk Ayam Sambal Matah','20k'],['Nasi Daun Jeruk Kulit Ayam','20k'],['Lalapan Tempe Penyet','10k'],['Lalapan Telor','12k'],['Nasi Awur Awur Telor','15k']]},
        { title:'Savory', columns:['Harga'], items:[['Mix Platter','25k'],['Cireng','15k'],['French Fries','15k'],['Tahu Walik','15k'],['Onion Ring','15k'],['Risol Mayo','15k'],['Jamur Crispy','15k'],['Jamur Enoki','15k']]},
        { title:'Sweet', columns:['Harga'], items:[['Toast Tiramisu','15k'],['Toast Cokelat','15k'],['Toast Keju','15k'],['Toast Cokelat Keju','17k'],['Banana Roll','15k'],['Pisang Goreng','15k'],['Maryam Slovv','15k']]},
        { title:'Add On', columns:['Harga'], items:[['Sosis','3k'],['Telur','4k'],['Nugget','3k']]}
      ]
    };

    const home = document.querySelector('#homeView');
    const menu = document.querySelector('#menuView');
    const groups = document.querySelector('#menuGroups');
    const tabs = [...document.querySelectorAll('.tab')];

    function renderMenu(key) {
      groups.innerHTML = menus[key].map((group, index) => {
        const single = group.columns.length === 1;
        const heading = `<div class="price-head"><span>${group.title}</span>${group.columns.map(c => `<span>${c}</span>`).join('')}</div>`;
        const rows = group.items.map(item => `<div class="menu-row"><span class="item-name">${item[0]}</span>${item.slice(1).map(p => `<span class="price">${p}</span>`).join('')}</div>`).join('');
        return `<section class="menu-group${single ? ' single-price' : ''}" style="animation-delay:${index * 55}ms"><h3>${group.title}</h3>${heading.replace(`<span>${group.title}</span>`, '<span>Menu</span>')}${rows}</section>`;
      }).join('');
    }

    function showMenuView() {
      home.hidden = true;
      menu.hidden = false;
      menu.classList.remove('enter'); void menu.offsetWidth; menu.classList.add('enter');
      renderMenu('coffee'); window.scrollTo({ top:0, behavior:'smooth' }); history.replaceState(null,'','#menu');
    }
    function showHomeView() {
      menu.hidden = true;
      home.hidden = false;
      home.classList.remove('enter'); void home.offsetWidth; home.classList.add('enter');
      window.scrollTo({ top:0, behavior:'smooth' }); history.replaceState(null,'',location.pathname);
    }
    document.querySelector('#showMenu').addEventListener('click', showMenuView);
    document.querySelector('#backHome').addEventListener('click', showHomeView);
    tabs.forEach(tab => tab.addEventListener('click', () => {
      tabs.forEach(t => t.setAttribute('aria-selected', String(t === tab)));
      renderMenu(tab.dataset.menu);
    }));
    if (location.hash === '#menu') showMenuView();
  </script>
</body>
</html>
